<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM User Card</title>
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script defer src="./assets/js/index.js"></script>
</head>
<body>
  <article class="user-card">
    <img class="user-card-background" src="./assets/img/background.jpg" alt="user background profile">
    
    <div class="user-card-avatar">
      <img class="user-avatar" src="./assets/img/avatar.jpg" alt="user avatar">
    </div>

    <div class="user-info">
      <h2 id="user-name" class="user-card-name">name</h2>
      <p id="user-nickname" class="user-card-nickname">nickname</p>
    </div>

    <div class="user-actions">
      <button id="follow-btn" class="action-btn">Subscribe</button>
      <button id="like-btn" class="like-btn">
        <span class="heart-icon">❤️</span>
      </button>
    </div>

    <nav>
      <ul class="nav-links">
        <li><a data-target="profile" id="user-profile" class="nav-link" href="#" >Profile</a></li>
        <li><a data-target="publications" id="user-publications" class="nav-link" href="#" >Publications</a></li>
        <li><a data-target="projects" id="user-projects" class="nav-link" href="#" >Projects</a></li>
      </ul>
    </nav>

    <div class="main-card-content">
      <div id="profile" class="user-main-info">
        <p id="user-bio">bio</p>
        <p id="user-date">date</p>
        <p id="user-profession">profession</p>
        <p id="user-phone" class="user-phone" data-phone="+380971234567">+380971234567</p>
      </div>
      
      <div id="publications" class="user-publications-content"></div>
      
      <div id="projects">
        <p>Coming soon...</p>
      </div>
    </div>
  </article>
</body>
</html>
